title: Journal
description: A daily log of small AI experiments — a new way of responding to the world.
author: shoreless
url: "https://shoreless.github.io"
baseurl: "/journal"

permalink: /:year/:month/:day/:title/
timezone: UTC
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values: { layout: entry }
  - scope: { path: "" }
    values: { layout: default }

# Keep works/ byte-for-byte: GitHub Pages would otherwise turn stray Markdown files
# (README.md, notes) inside a work into pages.
require_front_matter: true
readme_index:
  enabled: false

# Built sites often ship folders starting with "_" which Jekyll would otherwise skip.
include:
  - _next
  - _astro
  - _app

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
