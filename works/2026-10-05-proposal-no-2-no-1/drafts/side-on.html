<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060d">
<title>Fl(2) 10s</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #begin {
    position: fixed; inset: 0; border: 0; padding: 0; margin: 0;
    background: #05060d; cursor: pointer; transition: opacity 4s ease;
  }
  #begin.gone { opacity: 0; pointer-events: none; }
  #begin i {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px;
    border-radius: 50%; background: #fff4df;
    box-shadow: 0 0 12px 4px rgba(255,244,223,.35);
    animation: fl2 10s infinite;
  }
  /* Two white flashes every ten seconds, like the real light. */
  @keyframes fl2 {
    0%, 1.5%, 14%, 15.5%, 100% { opacity: .08; }
    3%, 4.5% { opacity: 1; }
    9% { opacity: .08; }
    17%, 18.5% { opacity: 1; }
    23% { opacity: .08; }
  }
  .corner {
    position: fixed; bottom: 14px; width: 34px; height: 34px; border: 0; padding: 7px;
    background: none; color: #d8d2c8; opacity: 0; cursor: pointer; transition: opacity 1.2s;
  }
  .corner svg { width: 100%; height: 100%; }
  #mute { right: 14px; }
  #again { right: 54px; display: none; }
  body.awake .corner { opacity: .3; }
  body.awake .corner:hover, .corner:focus-visible { opacity: .8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="begin" aria-label="Begin, with sound"><i></i></button>
<button id="mute" class="corner" aria-label="Sound off" aria-pressed="false">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor" stroke="none"/>
    <path class="on" d="M13 7.5c1 1.4 1 3.6 0 5M15.5 5.5c2 2.6 2 6.4 0 9"/>
    <path class="off" d="M13 7.5l4.5 5M17.5 7.5l-4.5 5" style="display:none"/>
  </svg>
</button>
<button id="again" class="corner" aria-label="Watch again">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M15.5 10a5.5 5.5 0 1 1-1.8-4.1M14 2.8v3.4h-3.4"/>
  </svg>
</button>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Dusk on the cape. The lighthouse on its point, the gap of sea, the cliff
// across from it. The light turns: two white flashes every ten seconds.
// Whatever happens on the cliff, we only see it when the beam comes round.
// ---------------------------------------------------------------------------

const W = 1920, H = 1080, HORIZON = 600, WATER = 780;
const FOCUS = { x: 880, y: 560 };

// ---- small helpers ----------------------------------------------------------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { a = hex(a); b = hex(b); return `rgb(${lerp(a[0], b[0], t) | 0},${lerp(a[1], b[1], t) | 0},${lerp(a[2], b[2], t) | 0})`; };
const toPath = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// Angular, broken edges: straight segments with a little jitter, like cut paper.
function jag(ctrl, step, amp, seed) {
  const r = rng(seed), out = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const [ax, ay] = ctrl[i], [bx, by] = ctrl[i + 1], n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
    for (let k = 0; k < n; k++) {
      const u = k / n, j = (k === 0) ? 0 : (r() - .5) * amp;
      out.push([lerp(ax, bx, u) + (r() - .5) * amp * .3, lerp(ay, by, u) + j]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}

// ---- the cape -----------------------------------------------------------------
// Lighthouse point, left. Its lantern is the source of everything.
const LANTERN = [468, 352];
const pointTop = jag([[-400, 470], [-20, 474], [120, 462], [250, 470], [340, 468], [600, 470], [660, 488], [700, 520],
  [730, 560], [770, 600], [790, 650], [830, 700], [860, 760], [880, WATER + 4]], 26, 16, 3);
const point = pointTop.concat([[880, 3000], [-400, 3000]]);
// Their cliff, right: a sheer face toward the lighthouse, broken ground behind.
const cliffTop = (() => {
  const raw = jag([[1158, 622], [1180, 612], [1240, 610], [1330, 606], [1400, 596], [1460, 604], [1520, 584],
    [1600, 592], [1700, 572], [1780, 580], [1880, 560], [2400, 556]], 22, 14, 7);
  return raw.map(([x, y]) => { const k = smooth(1 - Math.abs(x - 1262) / 90); return [x, lerp(y, 611 - (x - 1180) * .03, k)]; });
})();
const cliffFace = jag([[1132, WATER + 4], [1140, 740], [1128, 700], [1146, 660], [1150, 636], [1158, 622]], 18, 12, 9);
const cliff = cliffFace.concat(cliffTop.slice(1), [[2400, 3000], [1132, 3000]]);
// The ridge behind the cliff, so the two of them stand against rock, not sky.
const ridge = jag([[1020, 640], [1060, 586], [1150, 560], [1260, 548], [1360, 530], [1480, 540], [1600, 516],
  [1760, 528], [1900, 506], [2400, 500], [2400, 700], [1020, 700]], 30, 12, 11);
// Further headlands of the cape, fading into the dusk.
const farHills = jag([[700, 604], [760, 588], [900, 582], [1010, 570], [1100, 578], [1180, 600], [1180, 640], [700, 640]], 28, 8, 13);
const farRange = jag([[-400, 596], [-100, 580], [150, 566], [380, 574], [560, 586], [700, 596], [700, 640], [-400, 640]], 34, 10, 17);
// The road they drove in on, across the ridge.
const road = (() => {
  const c = [[2000, 520], [1880, 532], [1760, 540], [1650, 534], [1540, 552], [1440, 548], [1340, 560], [1250, 566]];
  const out = []; for (let i = 0; i < c.length - 1; i++) for (let s = 0; s < 1; s += .1) out.push([lerp(c[i][0], c[i + 1][0], s), lerp(c[i][1], c[i + 1][1], s)]);
  out.push(c[c.length - 1]); return out;
})();
const P = { point: toPath(point), cliff: toPath(cliff), ridge: toPath(ridge), farHills: toPath(farHills), farRange: toPath(farRange) };

function topY(x) {
  for (let i = 0; i < cliffTop.length - 1; i++) {
    const a = cliffTop[i], b = cliffTop[i + 1];
    if (x >= a[0] && x <= b[0]) return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0] || 1));
  }
  return 610;
}
function along(path, u) {
  const f = clamp(u, 0, 1) * (path.length - 1), i = Math.floor(f), k = f - i;
  const a = path[i], b = path[Math.min(i + 1, path.length - 1)];
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
}

// ---- palette: dusk → night ------------------------------------------------------
const C = {
  sky: [['#191b2e', '#04050b'], ['#252640', '#070912'], ['#3b3452', '#0b0d1a'], ['#5d4460', '#101324'],
        ['#86566a', '#15182c'], ['#ac6c6c', '#1b1d33'], ['#c58772', '#22243a']],
  cloud: ['#2f2b44', '#0a0b15'], cloud2: ['#4a3a55', '#0e101c'],
  farRange: ['#40384f', '#11131f'], farHills: ['#332d43', '#0d0f19'],
  sea: ['#262538', '#080a13'], seaLine: ['#4d415a', '#141729'],
  ridge: ['#231f30', '#090a12'], cliff: ['#141219', '#040509'], point: ['#121017', '#040508'],
  house: ['#b9b0b0', '#3c3d4c'], houseShade: ['#8e868c', '#2a2b37'], window: ['#2a2532', '#0c0d14'],
};
const LIT = { cliff: '#d9d1c4', cliffDeep: '#b9b1a6', ridge: '#8f8a92', water: '#a7aab8', figure: '#fff6e8', point: '#bfb7ad' };

// ---- the evening, as a timeline ----------------------------------------------
// The optic turns at 36°/s with two panels 57.6° apart: two flashes, 1.6 s
// apart, every 10 s. A panel "faces the cliff" at angle 0.
const OMEGA = 36, PANEL_GAP = 57.6;
const INTRO = 6;
const Z = [0, 1, 2, 3, 4].map(k => INTRO + 3 + k * 10);  // panel A faces the cliff
const DECEL = 2.4, ACCEL = 2.4, HOLD = 7.5;
const holdStart = Z[4] + 10 + DECEL / 2;                  // fifth time round, it stops
const decelStart = holdStart - DECEL;
const holdEnd = holdStart + HOLD;
const ENDING = holdEnd + 50;

// Rotation angle of panel A relative to the cliff, in degrees.
function theta(t) {
  const base = -(Z[0]) * OMEGA;                             // so that theta(Z[k]) ≡ 0
  if (t < decelStart) return base + OMEGA * t;
  const a0 = base + OMEGA * decelStart;
  if (t < holdStart) { const u = t - decelStart; return a0 + OMEGA * (u - u * u / (2 * DECEL)); }
  const ah = a0 + OMEGA * DECEL / 2;
  if (t < holdEnd) return ah + Math.sin((t - holdStart) * .9) * .15;
  const u = t - holdEnd;
  if (u < ACCEL) return ah + OMEGA * u * u / (2 * ACCEL);
  return ah + OMEGA * ACCEL / 2 + OMEGA * (u - ACCEL);
}
const wrap = a => ((a % 360) + 540) % 360 - 180;

// What the two of them are doing. Changes only ever happen in the dark.
function pose(t) {
  if (t < Z[2] - 4) return null;
  if (t < Z[3] - 4) return { kind: 'walk', u: (t - (Z[2] - 4)) / 8 };
  if (t < Z[4] - 4) return { kind: 'turn' };
  if (t < holdStart - 4) return { kind: 'away' };
  if (t < holdEnd + .4) return { kind: 'kneel', h: t - holdStart };
  if (t < holdEnd + 8) return { kind: 'hold' };
  return null;
}
const dusk = t => smooth((t - INTRO) / (holdEnd + 25 - INTRO));

// ---- the beam -------------------------------------------------------------------
// A beam tilted slightly down. Seen from the side, its slope steepens as it
// turns toward or away from us, so its spot runs out across the water, up the
// cliff to the two of them, and back.
const AIM = [1300, topY(1300) - 2];
const TILT = (AIM[1] - LANTERN[1]) / (AIM[0] - LANTERN[0]);
const SPREAD = .026;
const probe = document.createElement('canvas').getContext('2d');

function beamGeometry(phi) {
  const c = Math.cos(phi * Math.PI / 180);
  if (Math.abs(c) < .03) return null;
  const dir = Math.sign(c), slope = TILT / Math.abs(c);
  const [lx, ly] = LANTERN;
  let hit = null, x = lx + dir * 24;
  for (let i = 0; i < 520; i++, x += dir * 5) {
    const y = ly + slope * Math.abs(x - lx);
    if (y >= WATER) { const xw = lx + dir * (WATER - ly) / slope; hit = { x: xw, y: WATER, on: 'water' }; break; }
    if (dir > 0 && x > 1100 && probe.isPointInPath(P.cliff, x, y)) { hit = { x, y, on: 'cliff' }; break; }
    if (dir < 0 && probe.isPointInPath(P.point, x, y)) { hit = { x, y, on: 'point' }; break; }
    if (x < -420 || x > W + 420) { hit = { x, y, on: 'air' }; break; }
  }
  return { dir, c, hit };
}

function wedge(g, from, to, extra) {
  const dx = to[0] - from[0], dy = to[1] - from[1], d = Math.hypot(dx, dy) || 1;
  const nx = -dy / d, ny = dx / d, w0 = 3, w1 = d * SPREAD + 3 + (extra || 0);
  g.beginPath();
  g.moveTo(from[0] + nx * w0, from[1] + ny * w0);
  g.lineTo(to[0] + nx * w1, to[1] + ny * w1);
  g.lineTo(to[0] - nx * w1, to[1] - ny * w1);
  g.lineTo(from[0] - nx * w0, from[1] - ny * w0);
  g.closePath();
}

// ---- figures -----------------------------------------------------------------------
const FIG = 38;
function person(g, x, yF, o) {
  const h = FIG, f = o.facing, w = h * .2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  let hipY, shY, headY;
  if (o.kneel) {
    hipY = yF - h * .32; shY = yF - h * .64; headY = yF - h * .75;
    g.lineWidth = w * .44;
    g.beginPath(); g.moveTo(x, hipY); g.lineTo(x + f * h * .17, yF - h * .28); g.lineTo(x + f * h * .18, yF); g.stroke();
    g.beginPath(); g.moveTo(x, hipY); g.lineTo(x - f * h * .02, yF - 1.2); g.lineTo(x - f * h * .2, yF - 1); g.stroke();
  } else {
    hipY = yF - h * .48; shY = yF - h * .79; headY = yF - h * .9;
    const s = o.stride || 0;
    g.lineWidth = w * .44;
    g.beginPath(); g.moveTo(x, hipY); g.lineTo(x + s * h * .1 + w * .12, yF); g.stroke();
    g.beginPath(); g.moveTo(x, hipY); g.lineTo(x - s * h * .1 - w * .12, yF); g.stroke();
  }
  g.beginPath(); g.ellipse(x + f * .5, (hipY + shY) / 2, w * .58, (hipY - shY) / 2 + 1.5, f * (o.lean || 0), 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(x + f * 1, headY, h * .08, 0, Math.PI * 2); g.fill();
  g.lineWidth = w * .32;
  for (const [hx, hy] of o.hands) { g.beginPath(); g.moveTo(x + f * .8, shY + 1.5); g.lineTo(x + hx * h * f, yF + hy * h); g.stroke(); }
}
const A = 1238, B = 1264;                                  // her, him: him nearer the light's aim
function drawPair(g, p, t) {
  const down = [[.06, -.5], [-.05, -.5]];
  if (p.kind === 'walk') {
    const x = lerp(1340, A, smooth(p.u)), ph = t * 5.5;
    person(g, x, topY(x), { facing: -1, stride: Math.sin(ph), hands: down });
    person(g, x + 24, topY(x + 24), { facing: -1, stride: Math.sin(ph + 2.4), hands: down });
  } else if (p.kind === 'turn') {
    person(g, A, topY(A), { facing: 1, hands: [[.28, -.92], [.04, -.5]] });
    person(g, B, topY(B), { facing: -1, hands: down });
  } else if (p.kind === 'away') {
    person(g, A - 4, topY(A - 4), { facing: -1, hands: [[-.02, -.5], [.12, -.56]], lean: .08 });
    person(g, B, topY(B), { facing: -1, hands: down });
  } else if (p.kind === 'kneel') {
    const k = smooth((p.h - 2.6) / 1.2);               // her hands go to her face
    person(g, A, topY(A), { facing: 1, hands: [[lerp(.05, .07, k), lerp(-.5, -.86, k)], [lerp(-.04, .09, k), lerp(-.5, -.84, k)]] });
    person(g, B, topY(B), { facing: -1, kneel: true, hands: [[.27, -.54], [.07, -.38]] });
  } else if (p.kind === 'hold') {
    person(g, A + 8, topY(A + 8), { facing: 1, hands: [[.2, -.72], [.24, -.62]], lean: .1 });
    person(g, A + 20, topY(A + 20), { facing: -1, hands: [[.2, -.74], [.22, -.64]], lean: .1 });
  }
}

// ---- other small things ---------------------------------------------------------
const stars = (() => { const r = rng(91), s = []; for (let i = 0; i < 220; i++) s.push([r() * 2800 - 440, Math.pow(r(), 1.3) * (HORIZON - 60) - 300, r() * .9 + .3, r() * 6, r() < .1 ? 2.4 : 1.6]); return s; })();
const clouds = (() => { const r = rng(19), c = []; for (let i = 0; i < 6; i++) c.push({ x: r() * 2600 - 400, y: 110 + r() * 300, w: 300 + r() * 700, h: 10 + r() * 18, v: 2 + r() * 5, tone: r() < .5 }); return c; })();
const bats = (() => { const r = rng(97), b = []; for (let i = 0; i < 3; i++) b.push({ cx: 1150 + r() * 500, cy: 400 + r() * 90, rx: 60 + r() * 160, ry: 16 + r() * 40, sp: .35 + r() * .5, ph: r() * 6 }); return b; })();
function bat(g, x, y, t, s = 1) {
  const flap = Math.sin(t * 24) * 3 * s;
  g.beginPath(); g.moveTo(x - 7 * s, y - flap); g.lineTo(x - 2.5 * s, y + .5 * s); g.lineTo(x, y - 1 * s);
  g.lineTo(x + 2.5 * s, y + .5 * s); g.lineTo(x + 7 * s, y - flap); g.lineTo(x + 3 * s, y + 2 * s); g.lineTo(x, y + 1.2 * s);
  g.lineTo(x - 3 * s, y + 2 * s); g.closePath(); g.fill();
}
const seaLines = (() => { const r = rng(23), s = []; for (let i = 0; i < 70; i++) { const d = Math.pow(r(), 1.5); s.push({ y: HORIZON + 4 + d * 420, x: r() * 2800 - 440, w: 20 + d * 160 + r() * 60, v: (r() - .3) * 6, ph: r() * 6 }); } return s; })();

function lighthouse(g, n, litFace) {
  // Low white keeper's house with a square tower rising from its middle.
  g.fillStyle = mix(...C.house, n); g.fillRect(372, 418, 196, 54);
  g.fillStyle = mix(...C.houseShade, n); g.fillRect(372, 418, 196, 8); g.fillRect(540, 426, 28, 46);
  g.fillStyle = mix(...C.house, n); g.fillRect(450, 372, 36, 50);
  g.fillStyle = mix(...C.houseShade, n); g.fillRect(476, 372, 10, 50); g.fillRect(444, 366, 48, 7);
  g.fillStyle = mix(...C.window, n);
  for (const x of [392, 420, 512]) g.fillRect(x, 436, 12, 18);
  g.fillRect(462, 384, 9, 14);
  // Lantern: railing, glass, dome.
  g.fillStyle = mix('#2a2833', '#0b0c13', n); g.fillRect(454, 360, 28, 6); g.fillRect(464, 332, 8, 4);
  g.beginPath(); g.moveTo(456, 340); g.lineTo(468, 328); g.lineTo(480, 340); g.closePath(); g.fill();
  g.fillStyle = '#fff1d6'; g.fillRect(458, 341, 20, 19);
}

// ---- canvas & frame ---------------------------------------------------------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, cw = 0, ch = 0, view = { s: 1, ox: 0, oy: 0 }, grain, vignette;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  cw = cv.width = Math.round(vw * DPR); ch = cv.height = Math.round(vh * DPR);
  // Fill the screen, but always keep the lighthouse and the cliff in view.
  const s = Math.min(Math.max(vw / W, vh / H), vw / 1240);
  view = { s, ox: vw / 2 - FOCUS.x * s, oy: vh / 2 - FOCUS.y * s };
  vignette = document.createElement('canvas'); vignette.width = cw; vignette.height = ch;
  const vg = vignette.getContext('2d'), rg = vg.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * .35, cw / 2, ch / 2, Math.hypot(cw, ch) * .62);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.5)');
  vg.fillStyle = rg; vg.fillRect(0, 0, cw, ch);
}
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'), d = g.createImageData(160, 160), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
}

function frame(t) {
  const n = dusk(t), p = pose(t), th = theta(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.setTransform(view.s * DPR, 0, 0, view.s * DPR, view.ox * DPR, view.oy * DPR);

  // Sky in flat bands, deepening.
  const bands = C.sky.length, top = -2000, bandH = (HORIZON - 40) / bands;
  ctx.fillStyle = mix(...C.sky[0], n); ctx.fillRect(-2000, top, 6000, 2000 + bandH * .5);
  C.sky.forEach((c, i) => { ctx.fillStyle = mix(...c, n); ctx.fillRect(-2000, 40 + i * bandH - bandH * .5 + (i ? 0 : 0), 6000, bandH + 60); });
  ctx.fillStyle = '#fff4e4';
  for (const [x, y, b, ph, sz] of stars) { ctx.globalAlpha = clamp(n * 1.8 - .55, 0, 1) * b * (.7 + .3 * Math.sin(t * 1.2 + ph)); ctx.fillRect(x, y, sz, sz); }
  ctx.globalAlpha = 1;
  for (const c of clouds) {
    const x = ((c.x + t * c.v) % 3000 + 3000) % 3000 - 500;
    ctx.fillStyle = mix(...(c.tone ? C.cloud : C.cloud2), n);
    ctx.beginPath(); ctx.roundRect(x, c.y, c.w, c.h, c.h / 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + c.w * .18, c.y - c.h * .7, c.w * .5, c.h, c.h / 2); ctx.fill();
  }

  // Far land, sea.
  ctx.fillStyle = mix(...C.farRange, n); ctx.fill(P.farRange);
  ctx.fillStyle = mix(...C.sea, n); ctx.fillRect(-2000, HORIZON, 6000, 3000);
  ctx.fillStyle = mix(...C.farHills, n); ctx.fill(P.farHills);
  ctx.fillStyle = mix(...C.seaLine, n);
  for (const l of seaLines) {
    const x = ((l.x + t * l.v) % 2900 + 2900) % 2900 - 450;
    ctx.globalAlpha = .55 + .45 * Math.sin(t * .7 + l.ph);
    ctx.fillRect(x, l.y, l.w * (.8 + .2 * Math.sin(t * .5 + l.ph)), 2 + (l.y - HORIZON) / 140);
  }
  ctx.globalAlpha = 1;

  // Bats, while there's still light to see them against.
  if (t > Z[1] && t < holdStart) {
    ctx.fillStyle = mix('#0e0d15', '#030409', n);
    for (const b of bats) { const a = t * b.sp + b.ph; bat(ctx, b.cx + Math.cos(a) * b.rx + Math.sin(a * 2.7) * 20, b.cy + Math.sin(a * 1.3) * b.ry, t + b.ph, 1); }
  }

  ctx.fillStyle = mix(...C.ridge, n); ctx.fill(P.ridge);
  // Car lights on the road through the park, long before anyone is on the cliff.
  if (t > Z[1] - 7 && t < Z[1] + 5) {
    const u = (t - Z[1] + 7) / 12, [x, y] = along(road, u), fade = smooth(u * 6) * smooth((1 - u) * 5);
    ctx.globalCompositeOperation = 'lighter';
    for (const dx of [-1.5, 1.5]) {
      const gl = ctx.createRadialGradient(x + dx, y - 2, 0, x + dx, y - 2, 6);
      gl.addColorStop(0, `rgba(255,236,200,${fade})`); gl.addColorStop(1, 'rgba(255,236,200,0)');
      ctx.fillStyle = gl; ctx.fillRect(x + dx - 6, y - 8, 12, 12);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = mix(...C.cliff, n); ctx.fill(P.cliff);
  if (p) { ctx.fillStyle = ctx.strokeStyle = mix('#1d1a28', '#08090f', n); drawPair(ctx, p, t); }
  ctx.fillStyle = mix(...C.point, n); ctx.fill(P.point);
  lighthouse(ctx, n);

  // The light. Each panel throws a beam; it lands where it lands.
  const beams = [];
  for (const off of [0, PANEL_GAP]) {
    const phi = wrap(th - off), geo = beamGeometry(phi);
    if (geo) beams.push({ phi, ...geo });
  }
  for (const b of beams) {
    const hit = b.hit, k = Math.pow(Math.abs(b.c), 7) * (b.dir > 0 ? 1 : .55);
    if (k < .01) continue;
    // The shaft in the air: hard-edged, see-through.
    const sl = (hit.y - LANTERN[1]) / (hit.x - LANTERN[0]), on = [hit.x + b.dir * 24, hit.y + sl * b.dir * 24];
    const end = hit.on === 'air' || hit.on === 'water' ? [hit.x, hit.y] : on;
    ctx.save();
    if (hit.on !== 'air') { const outside = new Path2D(); outside.rect(-3000, -3000, 8000, 8000); outside.addPath(hit.on === 'point' ? P.point : P.cliff); ctx.clip(outside, 'evenodd'); }
    ctx.fillStyle = `rgba(238,236,230,${.15 * k})`; wedge(ctx, LANTERN, end); ctx.fill();
    ctx.fillStyle = `rgba(238,236,230,${.15 * k})`; wedge(ctx, LANTERN, end, -((Math.hypot(end[0] - LANTERN[0], end[1] - LANTERN[1]) * SPREAD) * .55)); ctx.fill();
    ctx.restore();
    // Where it lands.
    const d = Math.hypot(hit.x - LANTERN[0], hit.y - LANTERN[1]), rad = d * SPREAD * 1.9 + 10;
    ctx.save();
    if (hit.on === 'cliff' || hit.on === 'point') {
      // Light lies along the ground it lands on: a thin bright skin on the rock.
      ctx.clip(hit.on === 'cliff' ? P.cliff : P.point);
      ctx.globalAlpha = k; ctx.fillStyle = hit.on === 'cliff' ? LIT.cliff : LIT.point;
      const r0 = rad * 1.9, r1 = rad * 1.1, ground = x => hit.on === 'cliff' ? topY(x) : hit.y;
      ctx.beginPath(); ctx.moveTo(hit.x - r0, ground(hit.x - r0) - 1);
      for (let x = hit.x - r0; x <= hit.x + r1; x += 6) ctx.lineTo(x, ground(x) - 1);
      ctx.lineTo(hit.x + r1, ground(hit.x + r1) + 3);
      for (let x = hit.x + r1; x >= hit.x - r0; x -= 6) { const e = 1 - Math.abs((x - hit.x) / (x > hit.x ? r1 : r0)); ctx.lineTo(x, ground(x) + 4 + e * 9); }
      ctx.closePath(); ctx.fill();
    } else if (hit.on === 'water') {
      ctx.fillStyle = LIT.water; ctx.globalAlpha = .85 * k;
      for (let i = -2; i <= 2; i++) ctx.fillRect(hit.x - rad * (2.6 - Math.abs(i) * .7) + Math.sin(t * 2 + i) * 4, hit.y - 6 + i * 5, rad * (5.2 - Math.abs(i) * 1.4), 2.4);
    }
    ctx.restore();
    // Anyone standing in it.
    if (p && hit.on === 'cliff') {
      ctx.save(); wedge(ctx, LANTERN, [hit.x + 60, hit.y + (hit.y - LANTERN[1]) / (hit.x - LANTERN[0]) * 60], 8); ctx.clip();
      ctx.fillStyle = ctx.strokeStyle = LIT.figure; ctx.globalAlpha = k; drawPair(ctx, p, t); ctx.restore();
    }
    // One bat flies straight through the light.
    if (t > Z[3] - 1.2 && t < Z[3] + 2.4) {
      const u = (t - Z[3] + 1.2) / 3.6, bx = lerp(1000, 1320, u), by = LANTERN[1] + TILT * (bx - LANTERN[0]) / Math.max(Math.abs(b.c), .2) - 14 + Math.sin(u * 9) * 10;
      ctx.save(); wedge(ctx, LANTERN, [hit.x, hit.y], 10); ctx.clip();
      ctx.fillStyle = '#efe9df'; bat(ctx, bx, by, t, 1.6); ctx.restore();
    }
  }
  // The lantern glares when a panel turns toward us.
  let glare = 0;
  for (const off of [0, PANEL_GAP]) { const s = Math.sin((th - off) * Math.PI / 180); if (s > 0) glare = Math.max(glare, Math.pow(s, 14)); }
  ctx.globalCompositeOperation = 'lighter';
  const gr = ctx.createRadialGradient(LANTERN[0], LANTERN[1], 0, LANTERN[0], LANTERN[1], 30 + glare * 150);
  gr.addColorStop(0, `rgba(255,244,222,${.55 + glare * .45})`); gr.addColorStop(.25, `rgba(255,236,206,${.15 + glare * .3})`); gr.addColorStop(1, 'rgba(255,236,206,0)');
  ctx.fillStyle = gr; ctx.fillRect(LANTERN[0] - 300, LANTERN[1] - 300, 600, 600);
  if (glare > .3) { ctx.fillStyle = `rgba(255,248,236,${(glare - .3) * .06})`; ctx.fillRect(-2000, -2000, 6000, 6000); }
  // The ring, a pinprick, while the light waits on them.
  if (p && p.kind === 'kneel' && t > holdStart + .8 && t < holdEnd) {
    const gx = B - FIG * .27, gy = topY(B) - FIG * .54, a = smooth((t - holdStart - .8) / 1.5) * (.6 + .4 * Math.sin(t * 3.1));
    const gl = ctx.createRadialGradient(gx, gy, 0, gx, gy, 6);
    gl.addColorStop(0, `rgba(255,252,240,${a})`); gl.addColorStop(1, 'rgba(255,252,240,0)');
    ctx.fillStyle = gl; ctx.fillRect(gx - 6, gy - 6, 12, 12);
  }
  ctx.globalCompositeOperation = 'source-over';

  // Printed: a fine grain and a soft vignette.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(grain, 'repeat');
  const gx = (Math.random() * 160) | 0, gy = (Math.random() * 160) | 0;
  ctx.translate(gx, gy); ctx.fillRect(-gx, -gy, cw, ch); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vignette, 0, 0);
}

// ---- sound: the sea far below, and wind -----------------------------------------
let ac, master, sea, wash, muted = false;
function startSound() {
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const sr = ac.sampleRate, len = sr * 6;
  const brownB = ac.createBuffer(1, len, sr), whiteB = ac.createBuffer(1, len, sr);
  const b = brownB.getChannelData(0), w = whiteB.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const x = Math.random() * 2 - 1; w[i] = x; last = (last + .02 * x) / 1.02; b[i] = last * 3.5; }
  const src = buf => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 5); return s; };
  const filt = (type, f, q) => { const x = ac.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };

  master = gain(0); master.connect(ac.destination);
  master.gain.setTargetAtTime(.9, ac.currentTime, 2.2);
  const body = gain(.55); src(brownB).connect(filt('lowpass', 110, .5)).connect(body).connect(master);
  sea = gain(.22); src(brownB).connect(filt('lowpass', 520, .6)).connect(sea).connect(master);
  wash = gain(0); src(whiteB).connect(filt('bandpass', 950, .55)).connect(wash).connect(master);
  const windF = filt('bandpass', 380, 2.6), wind = gain(.035);
  src(whiteB).connect(windF).connect(wind).connect(master);
  const lfo = ac.createOscillator(), lfoG = gain(150); lfo.frequency.value = .06; lfo.connect(lfoG).connect(windF.frequency); lfo.start();
  const lfo2 = ac.createOscillator(), lfo2G = gain(.02); lfo2.frequency.value = .11; lfo2.connect(lfo2G).connect(wind.gain); lfo2.start();

  (function swell() {
    if (!ac) return;
    const now = ac.currentTime, rise = 2.2 + Math.random() * 2.4, peak = .38 + Math.random() * .3;
    sea.gain.setTargetAtTime(peak, now, rise / 3);
    sea.gain.setTargetAtTime(.18, now + rise, 1.6);
    wash.gain.setTargetAtTime(.05 + Math.random() * .05, now + rise * .8, .4);
    wash.gain.setTargetAtTime(0, now + rise + .6, 1.4);
    setTimeout(swell, (rise + 3.5 + Math.random() * 4) * 1000);
  })();
}
function setVolume(v, tc) { if (master) master.gain.setTargetAtTime(muted ? 0 : v, ac.currentTime, tc); }

// ---- run --------------------------------------------------------------------------------
let t0 = null, ducked = false;
grain = makeGrain(); resize();
addEventListener('resize', resize);

// ?t=SECONDS freezes the evening at that moment (for stills).
const still = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(still)) { document.getElementById('begin').hidden = true; t0 = 0; }

function loop(now) {
  if (t0 !== null) {
    const t = isNaN(still) ? (now - t0) / 1000 : still;
    frame(t);
    const shouldDuck = t > holdStart && t < holdEnd;     // the sea seems to go quiet for a moment
    if (shouldDuck !== ducked) { ducked = shouldDuck; setVolume(ducked ? .45 : .9, ducked ? 1.4 : 2.5); }
    if (t > ENDING) document.getElementById('again').style.display = 'block';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const begin = document.getElementById('begin');
function go() {
  if (t0 !== null) return;
  t0 = performance.now(); begin.classList.add('gone'); begin.blur();
  startSound();
  setTimeout(() => document.body.classList.add('awake'), 6000);
}
begin.addEventListener('click', go);
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go(); });

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  muted = !muted; setVolume(ducked ? .45 : .9, .3);
  muteBtn.setAttribute('aria-pressed', muted); muteBtn.setAttribute('aria-label', muted ? 'Sound on' : 'Sound off');
  muteBtn.querySelector('.on').style.display = muted ? 'none' : ''; muteBtn.querySelector('.off').style.display = muted ? '' : 'none';
});
document.getElementById('again').addEventListener('click', () => { t0 = performance.now(); document.getElementById('again').style.display = 'none'; });
</script>
</body>
