<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9dcc6">
  <meta name="description" content="A dream about an inventor and his person-height knitted flowers. Unzip a stem and sit inside.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23e9dcc6%27/%3E%3Cpath d=%27M13 29V13q0-7 8-7%27 fill=%27none%27 stroke=%27%237f9b62%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2722%27 cy=%2710%27 r=%275%27 fill=%27%23dc6f84%27/%3E%3C/svg%3E">
  <title>Floor Weepies</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body class="intro" data-state="room">
  <canvas id="view" aria-label="A room of knitted flowers as tall as a person. Choose one, drag down to unzip its stem, climb in, and drag up to zip yourself inside. Arrow keys choose and move the zip, Enter climbs in or out, Escape goes back."></canvas>
  <div id="dark"></div>
  <div id="flash"></div>
  <p id="line">I dreamt I met an inventor who made knitted flowers as tall as a person. He called them floor weepies.</p>
  <p id="lovely">No idea why he named them that. Being inside one was lovely.</p>
  <p id="hint" aria-live="polite"></p>
  <button id="back">← back</button>
  <form id="names" autocomplete="off">
    <label for="name">We told him to call it something else.</label>
    <span><input id="name" name="name" maxlength="28" placeholder="a better name"><button>pin it up</button></span>
    <span id="said" aria-live="polite"></span>
  </form>
  <button id="sound" aria-pressed="false">sound off</button>
  <p id="nogl">This one needs WebGL, and this browser will not give it any.</p>
  <script type="module" src="./main.js"></script>
</body>
</html>
